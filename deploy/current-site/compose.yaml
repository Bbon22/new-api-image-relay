name: new-api

services:
  new-api:
    image: ${NEW_API_IMAGE:-new-api-image-relay:current}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["--log-dir", "/app/logs"]
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./backups:/data/backups
    environment:
      SQL_DSN: "postgresql://newapi:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/new-api"
      REDIS_CONN_STRING: "redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0"
      SESSION_SECRET: "${SESSION_SECRET:?Set SESSION_SECRET}"
      CRYPTO_SECRET: "${CRYPTO_SECRET:?Set CRYPTO_SECRET}"
      TZ: Asia/Shanghai
      DEFAULT_LANGUAGE: zh-CN
      ERROR_LOG_ENABLED: "true"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: new-api-node-1
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-127.0.0.1}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
      SESSION_COOKIE_TRUSTED_URL: "${SITE_ORIGIN:-https://zmw.bon2.space}"
      TASK_ARTIFACT_STORE_MODE: local
      TASK_ARTIFACT_STORE_LOCAL_ROOT: /data/task-artifacts
      TASK_PUBLIC_ADDRESS: "${TASK_PUBLIC_ADDRESS:-https://zmw.bon2.space}"
      TASK_ARTIFACT_SIGNING_KEY_VERSION: "${TASK_ARTIFACT_SIGNING_KEY_VERSION:-1}"
      TASK_BACKUP_STATUS_FILE: /data/backups/new-api.last-success
      TASK_BACKUP_MAX_AGE_SECONDS: "129600"
      TASK_HEARTBEAT_URL: "${TASK_HEARTBEAT_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}"
      POSTGRES_DB: new-api
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d new-api"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
